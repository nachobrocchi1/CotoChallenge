name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
              
      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify Module Dependencies
        run: go mod download && go mod verify

      - name: Execute Code Linter Compliance
        run: make lint

      - name: Run Unit Tests and Validate Coverage Target
        run: make coverage

      - name: Enforce Minimum Coverage Threshold (80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below the required 80% threshold"
            exit 1
          fi